<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우리학급위키</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --surface: #ffffff;
        --surface-soft: #eef3ff;
        --text: #172033;
        --muted: #667085;
        --line: #d8dfec;
        --primary: #3157d5;
        --primary-dark: #243fa0;
        --success: #138a52;
        --warning: #b7791f;
        --danger: #c2413d;
        --shadow: 0 18px 45px rgba(31, 42, 68, 0.12);
        --radius-xl: 28px;
        --radius-lg: 20px;
        --radius-md: 14px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top left, rgba(49, 87, 213, 0.16), transparent 34rem),
          var(--bg);
        color: var(--text);
        font-family:
          "Pretendard",
          "Noto Sans KR",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        line-height: 1.5;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.52;
      }

      .app-shell {
        margin: 0 auto;
        max-width: 1380px;
        padding: 28px;
      }

      .hero {
        background: linear-gradient(135deg, #18264c, #3157d5);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow);
        color: #ffffff;
        overflow: hidden;
        padding: 28px;
      }

      .topbar,
      .hero-grid,
      .section-heading,
      .file-title-row,
      .toolbar,
      .request-actions,
      .student-row,
      .meta-row {
        align-items: center;
        display: flex;
        gap: 16px;
      }

      .topbar,
      .section-heading,
      .file-title-row,
      .student-row {
        justify-content: space-between;
      }

      .hero h1,
      .hero h2,
      .section-heading h2,
      .file-detail h2,
      .teacher-panel h3 {
        margin: 0;
      }

      .hero h1 {
        font-size: clamp(2rem, 5vw, 4.25rem);
        letter-spacing: -0.06em;
      }

      .hero h2 {
        font-size: clamp(1.75rem, 4vw, 3.1rem);
        letter-spacing: -0.055em;
        line-height: 1.08;
        max-width: 760px;
      }

      .hero p {
        color: rgba(255, 255, 255, 0.78);
        margin: 14px 0 0;
        max-width: 700px;
      }

      .eyebrow {
        color: inherit;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        margin: 0 0 6px;
        text-transform: uppercase;
      }

      .hero .eyebrow {
        color: #b8c6ff;
      }

      .role-switcher {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        display: flex;
        padding: 5px;
      }

      .role-button {
        background: transparent;
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.72);
        font-weight: 800;
        padding: 10px 16px;
      }

      .role-button.active {
        background: #ffffff;
        color: var(--primary);
      }

      .hero-grid {
        align-items: flex-end;
        justify-content: space-between;
        margin-top: 54px;
      }

      .status-card {
        background: rgba(255, 255, 255, 0.13);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: var(--radius-lg);
        min-width: 280px;
        padding: 22px;
      }

      .status-dot {
        background: #77f2b1;
        border-radius: 50%;
        display: inline-block;
        height: 10px;
        margin-right: 8px;
        width: 10px;
      }

      .main-layout {
        display: grid;
        gap: 22px;
        grid-template-columns: 340px minmax(0, 1fr);
        margin-top: 22px;
      }

      .sidebar,
      .panel {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(216, 223, 236, 0.86);
        border-radius: var(--radius-xl);
        box-shadow: 0 16px 36px rgba(31, 42, 68, 0.08);
        padding: 22px;
      }

      .workspace {
        display: grid;
        gap: 22px;
      }

      .teacher-panel {
        grid-column: 1 / -1;
      }

      .teacher-grid {
        display: grid;
        gap: 22px;
        grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
      }

      .file-list,
      .request-list,
      .student-list {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }

      .file-card,
      .request-card,
      .student-row,
      .notice,
      .empty-state {
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        padding: 15px;
      }

      .file-card {
        text-align: left;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          transform 0.2s ease;
        width: 100%;
      }

      .file-card:hover,
      .file-card.active {
        border-color: rgba(49, 87, 213, 0.5);
        box-shadow: 0 12px 26px rgba(49, 87, 213, 0.12);
        transform: translateY(-1px);
      }

      .file-card strong {
        display: block;
        font-size: 1rem;
        margin: 9px 0 4px;
      }

      .file-card p,
      .request-card p,
      .empty-state p,
      .student-row p {
        color: var(--muted);
        margin: 4px 0 0;
      }

      .badge,
      .status-badge {
        border-radius: 999px;
        display: inline-flex;
        font-size: 0.78rem;
        font-weight: 800;
        padding: 5px 10px;
      }

      .badge-normal {
        background: #e8f7ef;
        color: var(--success);
      }

      .badge-important {
        background: #fff3db;
        color: var(--warning);
      }

      .badge-critical {
        background: #fde9e7;
        color: var(--danger);
      }

      .status-pending {
        background: #fff3db;
        color: var(--warning);
      }

      .status-approved {
        background: #e8f7ef;
        color: var(--success);
      }

      .status-rejected,
      .status-banned {
        background: #fde9e7;
        color: var(--danger);
      }

      .status-open {
        background: var(--surface-soft);
        color: var(--primary);
      }

      .secondary-button,
      .primary-button,
      .danger-button,
      .ghost-button {
        border-radius: 12px;
        font-weight: 800;
        padding: 10px 13px;
      }

      .primary-button {
        background: var(--primary);
        color: #ffffff;
      }

      .primary-button:hover {
        background: var(--primary-dark);
      }

      .secondary-button {
        background: var(--surface-soft);
        color: var(--primary);
      }

      .danger-button {
        background: #fde9e7;
        color: var(--danger);
      }

      .ghost-button {
        background: transparent;
        color: var(--primary);
      }

      .file-detail {
        display: grid;
        gap: 20px;
      }

      .meta-row {
        flex-wrap: wrap;
      }

      .content-preview,
      textarea,
      input,
      select {
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        width: 100%;
      }

      .content-preview {
        background: #fbfcff;
        min-height: 230px;
        padding: 20px;
        white-space: pre-wrap;
      }

      textarea {
        min-height: 180px;
        padding: 14px;
        resize: vertical;
      }

      input,
      select {
        padding: 12px 13px;
      }

      .editor-form,
      .request-form {
        display: grid;
        gap: 12px;
      }

      .toolbar {
        background: #fbfcff;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        flex-wrap: wrap;
        padding: 12px;
      }

      .toolbar label {
        align-items: center;
        color: var(--muted);
        display: inline-flex;
        font-size: 0.9rem;
        font-weight: 800;
        gap: 8px;
      }

      .toolbar input[type="color"] {
        height: 38px;
        padding: 4px;
        width: 54px;
      }

      .notice {
        background: #fff8e8;
        border-color: #f1c970;
        color: #7a4d00;
        font-weight: 700;
        margin-top: 14px;
      }

      .empty-state {
        border-style: dashed;
        text-align: center;
      }

      .hidden {
        display: none !important;
      }

      .toast {
        background: #172033;
        border-radius: 999px;
        bottom: 26px;
        box-shadow: var(--shadow);
        color: #ffffff;
        font-weight: 800;
        left: 50%;
        padding: 13px 18px;
        position: fixed;
        transform: translateX(-50%);
        z-index: 20;
      }

      @media (max-width: 960px) {
        .app-shell {
          padding: 16px;
        }

        .topbar,
        .hero-grid,
        .main-layout,
        .teacher-grid {
          display: grid;
          grid-template-columns: 1fr;
        }

        .role-switcher {
          width: max-content;
        }
      }

      @media (max-width: 640px) {
        .hero,
        .sidebar,
        .panel {
          border-radius: 20px;
          padding: 18px;
        }

        .section-heading,
        .file-title-row,
        .request-actions,
        .student-row {
          align-items: stretch;
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <nav class="topbar" aria-label="역할 전환">
          <div>
            <p class="eyebrow">고등학교 학급 지식 저장소</p>
            <h1>우리학급위키</h1>
          </div>
          <div class="role-switcher">
            <button class="role-button active" data-role="student" type="button">학생</button>
            <button class="role-button" data-role="teacher" type="button">담임선생님</button>
          </div>
        </nav>

        <section class="hero-grid" aria-label="서비스 소개">
          <div>
            <h2>반 친구들이 함께 쓰고, 중요한 문서는 함께 지켜요.</h2>
            <p>
              파일 중요도에 따라 수정 규칙이 달라지는 학급 전용 위키 프로토타입입니다.
              일반 파일은 학생이 바로 편집하고, 중요한 파일은 승인 흐름을 거칩니다.
            </p>
          </div>
          <div class="status-card">
            <span class="status-dot"></span>
            <strong id="current-role-label">학생 모드</strong>
            <p id="current-role-description">파일을 읽고, 일반 파일을 편집하며, 새 파일 추가를 요청할 수 있습니다.</p>
          </div>
        </section>
      </header>

      <main class="main-layout">
        <aside class="sidebar" aria-label="파일 목록">
          <div class="section-heading">
            <div>
              <p class="eyebrow">파일함</p>
              <h2>학급 파일</h2>
            </div>
            <button id="new-file-request-button" class="secondary-button" type="button">파일 추가 요청</button>
          </div>
          <div id="student-warning" class="notice hidden"></div>
          <div id="file-list" class="file-list"></div>
        </aside>

        <section class="workspace" aria-live="polite">
          <article class="panel file-panel">
            <div id="file-detail"></div>
          </article>

          <article class="panel request-panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">승인 상태</p>
                <h2>요청함</h2>
              </div>
            </div>
            <div id="request-list" class="request-list"></div>
          </article>
        </section>

        <section id="teacher-panel" class="panel teacher-panel hidden" aria-label="담임 관리자 화면">
          <div class="section-heading">
            <div>
              <p class="eyebrow">관리자</p>
              <h2>담임선생님 관리실</h2>
            </div>
          </div>
          <div class="teacher-grid">
            <section>
              <h3>승인 요청 관리</h3>
              <div id="teacher-request-list" class="request-list"></div>
            </section>
            <section>
              <h3>학생 활동 제재</h3>
              <div id="student-list" class="student-list"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <script>
      const typeLabels = {
        normal: "일반 파일",
        important: "중요 파일",
        critical: "최중요 파일",
      };

      const typeRules = {
        normal: "학생이 바로 수정 가능",
        important: "반 과반수 동의 필요",
        critical: "담임선생님 승인 필요",
      };

      const requestLabels = {
        "create-file": "파일 추가 요청",
        "edit-critical": "최중요 파일 수정 요청",
        "edit-important": "중요 파일 수정 동의",
      };

      const statusLabels = {
        pending: "대기 중",
        approved: "승인됨",
        rejected: "반려됨",
        open: "투표 진행 중",
      };

      const state = {
        role: "student",
        currentStudentId: 1,
        selectedFileId: 1,
        nextRequestId: 5,
        nextFileId: 5,
        previewStyle: {
          fontSize: 18,
          color: "#172033",
        },
        files: [
          {
            id: 1,
            title: "학급 공지 모음",
            type: "normal",
            content:
              "이번 주 공지\n- 수요일 7교시 학급회의\n- 금요일 체육대회 반 티셔츠 사이즈 조사\n- 청소 구역표는 매주 월요일 갱신",
            updatedBy: "김민준",
            updatedAt: "2026.05.14",
          },
          {
            id: 2,
            title: "수행평가 일정표",
            type: "important",
            content:
              "과목별 수행평가 일정\n- 국어: 토론 활동지 제출\n- 영어: 발표 대본 초안 제출\n- 통합사회: 자료 조사 카드 정리\n\n일정 변경은 반 과반수 동의 후 반영합니다.",
            updatedBy: "박서연",
            updatedAt: "2026.05.12",
          },
          {
            id: 3,
            title: "학급 운영 규칙",
            type: "critical",
            content:
              "우리 반 운영 규칙\n1. 서로의 개인정보를 허락 없이 올리지 않습니다.\n2. 중요한 공지와 규칙은 담임선생님 확인 후 수정합니다.\n3. 근거 없는 소문이나 비방은 작성하지 않습니다.",
            updatedBy: "담임선생님",
            updatedAt: "2026.05.10",
          },
          {
            id: 4,
            title: "동아리 추천 자료",
            type: "normal",
            content:
              "친구들이 추천하는 동아리와 준비 팁을 모아두는 파일입니다.\n- 방송부: 면접 질문을 미리 정리하면 좋아요.\n- 과학탐구반: 실험 보고서를 꾸준히 쓰는 친구에게 추천합니다.",
            updatedBy: "이하준",
            updatedAt: "2026.05.15",
          },
        ],
        students: [
          { id: 1, name: "김민준", banned: false },
          { id: 2, name: "박서연", banned: false },
          { id: 3, name: "이하준", banned: false },
          { id: 4, name: "최지우", banned: true },
          { id: 5, name: "정도윤", banned: false },
        ],
        requests: [
          {
            id: 1,
            kind: "create-file",
            title: "급식 메뉴 후기",
            requesterId: 2,
            status: "pending",
            description: "점심 메뉴 후기와 추천 조합을 모아두는 파일을 만들고 싶어요.",
          },
          {
            id: 2,
            kind: "edit-critical",
            fileId: 3,
            requesterId: 1,
            status: "pending",
            description: "개인정보 예시 문구를 더 명확하게 바꾸는 수정 요청입니다.",
          },
          {
            id: 3,
            kind: "edit-important",
            fileId: 2,
            requesterId: 3,
            status: "open",
            votes: 13,
            requiredVotes: 15,
            description: "영어 발표 대본 제출일을 다음 주 월요일로 변경 요청합니다.",
          },
          {
            id: 4,
            kind: "create-file",
            title: "시험 공부 자료실",
            requesterId: 4,
            status: "rejected",
            description: "활동금지 상태에서는 새 파일 요청이 제한된다는 예시입니다.",
          },
        ],
      };

      const elements = {
        roleButtons: document.querySelectorAll(".role-button"),
        currentRoleLabel: document.querySelector("#current-role-label"),
        currentRoleDescription: document.querySelector("#current-role-description"),
        fileList: document.querySelector("#file-list"),
        fileDetail: document.querySelector("#file-detail"),
        requestList: document.querySelector("#request-list"),
        teacherPanel: document.querySelector("#teacher-panel"),
        teacherRequestList: document.querySelector("#teacher-request-list"),
        studentList: document.querySelector("#student-list"),
        newFileRequestButton: document.querySelector("#new-file-request-button"),
        studentWarning: document.querySelector("#student-warning"),
        toast: document.querySelector("#toast"),
      };

      function getCurrentStudent() {
        return state.students.find((student) => student.id === state.currentStudentId);
      }

      function getSelectedFile() {
        return state.files.find((file) => file.id === state.selectedFileId) ?? state.files[0];
      }

      function getStudentName(studentId) {
        return state.students.find((student) => student.id === studentId)?.name ?? "알 수 없음";
      }

      function getFileTitle(fileId) {
        return state.files.find((file) => file.id === fileId)?.title ?? "새 파일";
      }

      function isStudentBlocked() {
        return state.role === "student" && getCurrentStudent()?.banned;
      }

      function showToast(message) {
        elements.toast.textContent = message;
        elements.toast.classList.remove("hidden");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => {
          elements.toast.classList.add("hidden");
        }, 2200);
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function statusClass(status) {
        return `status-${status}`;
      }

      function renderRole() {
        elements.roleButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.role === state.role);
        });

        const isTeacher = state.role === "teacher";
        elements.currentRoleLabel.textContent = isTeacher ? "담임선생님 모드" : "학생 모드";
        elements.currentRoleDescription.textContent = isTeacher
          ? "파일 추가와 최중요 파일 수정 요청을 승인하고, 학생 활동 제재를 관리합니다."
          : "파일을 읽고, 일반 파일을 편집하며, 새 파일 추가를 요청할 수 있습니다.";
        elements.teacherPanel.classList.toggle("hidden", !isTeacher);
        elements.newFileRequestButton.classList.toggle("hidden", isTeacher);
      }

      function renderStudentWarning() {
        const blocked = isStudentBlocked();
        elements.studentWarning.classList.toggle("hidden", !blocked);
        elements.studentWarning.textContent = blocked
          ? `${getCurrentStudent().name} 학생은 현재 위키 활동금지 상태입니다. 파일 수정과 추가 요청이 제한됩니다.`
          : "";
      }

      function renderFileList() {
        elements.fileList.innerHTML = state.files
          .map(
            (file) => `
              <button class="file-card ${file.id === state.selectedFileId ? "active" : ""}" data-file-id="${file.id}" type="button">
                <span class="badge badge-${file.type}">${typeLabels[file.type]}</span>
                <strong>${escapeHtml(file.title)}</strong>
                <p>${typeRules[file.type]}</p>
              </button>
            `,
          )
          .join("");
      }

      function renderFileDetail() {
        const file = getSelectedFile();
        const blocked = isStudentBlocked();
        const isTeacher = state.role === "teacher";
        const canEditDirectly = isTeacher || (file.type === "normal" && !blocked);
        const actionLabel = file.type === "normal" ? "수정 저장" : "수정 요청 보내기";
        const disabledReason = blocked ? "활동금지 상태에서는 파일을 수정할 수 없습니다." : "";

        elements.fileDetail.innerHTML = `
          <div class="file-detail">
            <div class="file-title-row">
              <div>
                <span class="badge badge-${file.type}">${typeLabels[file.type]}</span>
                <h2>${escapeHtml(file.title)}</h2>
              </div>
              <span class="status-badge status-open">${typeRules[file.type]}</span>
            </div>

            <div class="meta-row">
              <span>최근 수정: ${escapeHtml(file.updatedBy)}</span>
              <span>${escapeHtml(file.updatedAt)}</span>
            </div>

            <div class="toolbar" aria-label="글자 스타일 도구">
              <label>
                글자 크기
                <select id="font-size-control">
                  <option value="16">작게</option>
                  <option value="18">기본</option>
                  <option value="22">크게</option>
                  <option value="26">매우 크게</option>
                </select>
              </label>
              <label>
                글자 색상
                <input id="font-color-control" type="color" value="${state.previewStyle.color}" />
              </label>
            </div>

            <div
              id="content-preview"
              class="content-preview"
              style="font-size: ${state.previewStyle.fontSize}px; color: ${state.previewStyle.color};"
            >${escapeHtml(file.content)}</div>

            <form id="editor-form" class="editor-form">
              <label>
                본문 수정
                <textarea id="content-editor" ${blocked ? "disabled" : ""}>${escapeHtml(file.content)}</textarea>
              </label>
              ${disabledReason ? `<div class="notice">${disabledReason}</div>` : ""}
              <button class="primary-button" type="submit" ${blocked ? "disabled" : ""}>
                ${isTeacher || canEditDirectly ? "수정 저장" : actionLabel}
              </button>
            </form>
          </div>
        `;

        const fontSizeControl = document.querySelector("#font-size-control");
        const fontColorControl = document.querySelector("#font-color-control");
        fontSizeControl.value = String(state.previewStyle.fontSize);
        fontSizeControl.addEventListener("change", handleFontSizeChange);
        fontColorControl.addEventListener("input", handleFontColorChange);
        document.querySelector("#content-editor").addEventListener("input", handleEditorPreview);
        document.querySelector("#editor-form").addEventListener("submit", handleEditorSubmit);
      }

      function renderRequests() {
        const visibleRequests =
          state.role === "teacher"
            ? state.requests
            : state.requests.filter((request) => request.requesterId === state.currentStudentId);

        elements.requestList.innerHTML = renderRequestCards(visibleRequests, false);
      }

      function renderTeacherRequests() {
        elements.teacherRequestList.innerHTML = renderRequestCards(state.requests, true);
      }

      function renderRequestCards(requests, withActions) {
        if (requests.length === 0) {
          return `
            <div class="empty-state">
              <strong>표시할 요청이 없습니다.</strong>
              <p>파일 수정 또는 추가 요청을 보내면 이곳에 나타납니다.</p>
            </div>
          `;
        }

        return requests
          .map((request) => {
            const title = request.title ?? getFileTitle(request.fileId);
            const voteText =
              request.kind === "edit-important"
                ? `<p>찬성 ${request.votes ?? 0}명 / 필요 ${request.requiredVotes ?? 0}명</p>`
                : "";
            const actions =
              withActions && request.status === "pending"
                ? `
                  <div class="request-actions">
                    <button class="primary-button" data-request-action="approved" data-request-id="${request.id}" type="button">승인</button>
                    <button class="danger-button" data-request-action="rejected" data-request-id="${request.id}" type="button">반려</button>
                  </div>
                `
                : "";
            const voteAction =
              withActions && request.status === "open"
                ? `
                  <div class="request-actions">
                    <button class="secondary-button" data-request-action="add-vote" data-request-id="${request.id}" type="button">데모 찬성 1표 추가</button>
                    <button class="primary-button" data-request-action="approved" data-request-id="${request.id}" type="button">과반수 충족 처리</button>
                  </div>
                `
                : "";

            return `
              <article class="request-card">
                <div class="file-title-row">
                  <span class="badge">${requestLabels[request.kind]}</span>
                  <span class="status-badge ${statusClass(request.status)}">${statusLabels[request.status]}</span>
                </div>
                <h3>${escapeHtml(title)}</h3>
                <p>요청자: ${escapeHtml(getStudentName(request.requesterId))}</p>
                <p>${escapeHtml(request.description)}</p>
                ${voteText}
                ${actions}
                ${voteAction}
              </article>
            `;
          })
          .join("");
      }

      function renderStudents() {
        elements.studentList.innerHTML = state.students
          .map(
            (student) => `
              <div class="student-row">
                <div>
                  <strong>${escapeHtml(student.name)}</strong>
                  <p>${student.banned ? "위키 활동금지 상태" : "위키 활동 가능"}</p>
                </div>
                <button
                  class="${student.banned ? "secondary-button" : "danger-button"}"
                  data-student-id="${student.id}"
                  type="button"
                >
                  ${student.banned ? "제재 해제" : "활동금지"}
                </button>
              </div>
            `,
          )
          .join("");
      }

      function render() {
        renderRole();
        renderStudentWarning();
        renderFileList();
        renderFileDetail();
        renderRequests();
        renderTeacherRequests();
        renderStudents();
      }

      function handleRoleChange(event) {
        const nextRole = event.currentTarget.dataset.role;
        state.role = nextRole;
        render();
      }

      function handleFileSelect(event) {
        const fileButton = event.target.closest("[data-file-id]");
        if (!fileButton) return;
        state.selectedFileId = Number(fileButton.dataset.fileId);
        render();
      }

      function handleFontSizeChange(event) {
        state.previewStyle.fontSize = Number(event.target.value);
        document.querySelector("#content-preview").style.fontSize = `${state.previewStyle.fontSize}px`;
      }

      function handleFontColorChange(event) {
        state.previewStyle.color = event.target.value;
        document.querySelector("#content-preview").style.color = state.previewStyle.color;
      }

      function handleEditorPreview(event) {
        document.querySelector("#content-preview").textContent = event.target.value;
      }

      function handleEditorSubmit(event) {
        event.preventDefault();

        if (isStudentBlocked()) {
          showToast("활동금지 상태에서는 수정할 수 없습니다.");
          return;
        }

        const file = getSelectedFile();
        const nextContent = document.querySelector("#content-editor").value.trim();
        if (!nextContent) {
          showToast("본문 내용을 입력해 주세요.");
          return;
        }

        if (state.role === "teacher" || file.type === "normal") {
          file.content = nextContent;
          file.updatedBy = state.role === "teacher" ? "담임선생님" : getCurrentStudent().name;
          file.updatedAt = "방금 전";
          showToast("파일 내용이 저장되었습니다.");
          render();
          return;
        }

        const requestKind = file.type === "critical" ? "edit-critical" : "edit-important";
        const existingRequest = state.requests.find(
          (request) =>
            request.fileId === file.id &&
            request.requesterId === state.currentStudentId &&
            request.kind === requestKind &&
            ["pending", "open"].includes(request.status),
        );

        if (existingRequest) {
          showToast("이미 진행 중인 요청이 있습니다.");
          return;
        }

        state.requests.unshift({
          id: state.nextRequestId++,
          kind: requestKind,
          fileId: file.id,
          requesterId: state.currentStudentId,
          status: requestKind === "edit-important" ? "open" : "pending",
          votes: requestKind === "edit-important" ? 1 : undefined,
          requiredVotes: requestKind === "edit-important" ? Math.floor(state.students.length / 2) + 1 : undefined,
          description:
            requestKind === "edit-important"
              ? "중요 파일 수정을 위해 반 과반수 동의를 기다리는 중입니다."
              : "최중요 파일 수정을 위해 담임선생님의 승인을 기다리는 중입니다.",
        });
        showToast("수정 요청을 보냈습니다.");
        render();
      }

      function handleNewFileRequest() {
        if (isStudentBlocked()) {
          showToast("활동금지 상태에서는 파일 추가 요청을 보낼 수 없습니다.");
          return;
        }

        const title = window.prompt("추가하고 싶은 파일 제목을 입력해 주세요.", "새 학급 파일");
        if (!title?.trim()) return;

        state.requests.unshift({
          id: state.nextRequestId++,
          kind: "create-file",
          title: title.trim(),
          requesterId: state.currentStudentId,
          status: "pending",
          description: "학생이 새 파일 생성을 요청했습니다. 담임선생님의 승인이 필요합니다.",
        });
        showToast("파일 추가 요청을 보냈습니다.");
        render();
      }

      function handleRequestAction(event) {
        const actionButton = event.target.closest("[data-request-action]");
        if (!actionButton) return;

        const request = state.requests.find((item) => item.id === Number(actionButton.dataset.requestId));
        if (!request) return;

        const action = actionButton.dataset.requestAction;

        if (action === "add-vote") {
          request.votes = Math.min((request.votes ?? 0) + 1, request.requiredVotes ?? 0);
          if (request.votes >= request.requiredVotes) {
            request.status = "approved";
          }
          showToast("데모 찬성표가 추가되었습니다.");
          render();
          return;
        }

        request.status = action;
        if (action === "approved" && request.kind === "create-file") {
          state.files.push({
            id: state.nextFileId++,
            title: request.title,
            type: "normal",
            content: "담임선생님 승인으로 생성된 새 파일입니다. 학생들이 내용을 채워 넣을 수 있습니다.",
            updatedBy: "담임선생님",
            updatedAt: "방금 전",
          });
        }
        showToast(action === "approved" ? "요청을 승인했습니다." : "요청을 반려했습니다.");
        render();
      }

      function handleStudentSanction(event) {
        const studentButton = event.target.closest("[data-student-id]");
        if (!studentButton) return;

        const student = state.students.find((item) => item.id === Number(studentButton.dataset.studentId));
        if (!student) return;

        student.banned = !student.banned;
        showToast(student.banned ? `${student.name} 학생을 활동금지했습니다.` : `${student.name} 학생의 제재를 해제했습니다.`);
        render();
      }

      elements.roleButtons.forEach((button) => button.addEventListener("click", handleRoleChange));
      elements.fileList.addEventListener("click", handleFileSelect);
      elements.newFileRequestButton.addEventListener("click", handleNewFileRequest);
      elements.teacherRequestList.addEventListener("click", handleRequestAction);
      elements.studentList.addEventListener("click", handleStudentSanction);

      render();
    </script>
  </body>
</html>
